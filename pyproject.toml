[project]
name = "chessqa-benchmark"
version = "0.1.0"
description = "ChessQA benchmark — LLM chess understanding evaluation (CSSLab fork)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime deps live in requirements.txt (pip/venv workflow).
# Optional extras: requirements-optional.txt (semantic MCQ, offline vLLM pipeline).

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["dataset", "eval"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    # All E501 hits (43 as of 2026-07) are string literals: prompt templates, piece-arrangement
    # examples, and report format-strings. Splitting prompt strings would change model inputs and
    # break reproduction of the paper's runs, so long lines are allowed; code lines fit in 120.
    "E501",
    "B008",  # argparse defaults in function signatures (common in CLI scripts)
]

[tool.ruff.lint.isort]
known-first-party = ["dataset", "eval"]
